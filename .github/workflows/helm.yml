name: Helm

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

# Default: read-only. Only the release job gets packages:write.
permissions:
  contents: read

env:
  CHART_DIR: charts/libre-accounting
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7
  HELM_DOCS_VERSION: v1.14.2

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: helm lint
        # Default values alone fail intentionally (app.url/app.key/db.* are
        # required), so lint runs against each ci/ fixture.
        run: |
          for values in "$CHART_DIR"/ci/*.yaml; do
            echo "==> helm lint with $values"
            helm lint "$CHART_DIR" --strict -f "$values"
          done

      - name: Check chart README is up to date (helm-docs)
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" \
            "jnorwood/helm-docs:${HELM_DOCS_VERSION}" --chart-search-root=charts
          git diff --exit-code -- 'charts/*/README.md' \
            || { echo "::error::charts/*/README.md is stale. Regenerate with helm-docs (see the Chart docs section of the chart README)."; exit 1; }

      - name: helm template | kubeconform
        run: |
          # The datree CRDs catalog provides Gateway API v1 schemas.
          for values in "$CHART_DIR"/ci/*.yaml; do
            echo "==> kubeconform with $values"
            helm template libre-accounting "$CHART_DIR" -f "$values" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  release:
    name: Publish OCI chart
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check chart version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version=$(awk '/^version:/ {print $2}' "$CHART_DIR/Chart.yaml")
          if [ "$chart_version" != "$tag_version" ]; then
            echo "Chart.yaml version ($chart_version) does not match tag ($tag_version)." >&2
            echo "scripts/bump-version.js should keep them in sync — was the release cut with release-it?" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package "$CHART_DIR"
          helm push "libre-accounting-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
