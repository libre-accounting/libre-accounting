{{- $appKey := and (not .Values.app.existingSecret) .Values.app.key }}
{{- $dbPassword := and (not .Values.db.existingSecret) (ne .Values.db.connection "sqlite") .Values.db.password }}
{{- $redisPassword := and (include "libre-accounting.usesRedis" .) (not .Values.redis.existingSecret) .Values.redis.password }}
{{- $mailPassword := and (not .Values.mail.existingSecret) .Values.mail.password }}
{{- if or $appKey $dbPassword $redisPassword $mailPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "libre-accounting.fullname" . }}
  labels:
    {{- include "libre-accounting.labels" . | nindent 4 }}
  annotations:
    # Survives helm uninstall: this secret can hold the APP_KEY, whose loss
    # makes all encrypted application data unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $appKey }}
  app-key: {{ .Values.app.key | b64enc | quote }}
  {{- end }}
  {{- if $dbPassword }}
  db-password: {{ .Values.db.password | b64enc | quote }}
  {{- end }}
  {{- if $redisPassword }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
  {{- if $mailPassword }}
  mail-password: {{ .Values.mail.password | b64enc | quote }}
  {{- end }}
{{- end }}
