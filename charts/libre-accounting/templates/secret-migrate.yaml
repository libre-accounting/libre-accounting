{{- if and .Values.migrations.enabled (ne .Values.db.connection "sqlite") (not .Values.db.existingSecret) .Values.db.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "libre-accounting.fullname" . }}-migrate
  labels:
    {{- include "libre-accounting.labels" . | nindent 4 }}
  annotations:
    # Hook-scoped copy of the database password for the migrate Job: the
    # pre-upgrade hook runs BEFORE Helm updates the main chart Secret, so
    # reading that one would use the previous release's value and deadlock a
    # password rotation.
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  db-password: {{ .Values.db.password | b64enc | quote }}
{{- end }}
