{{- if and .Values.setup.enabled (ne .Values.db.connection "sqlite") }}
{{- $adminPassword := and (not .Values.setup.existingSecret) .Values.setup.adminPassword }}
{{- $dbPassword := and (not .Values.db.existingSecret) (ne .Values.db.connection "sqlite") .Values.db.password }}
{{- if or $adminPassword $dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "libre-accounting.fullname" . }}-setup
  labels:
    {{- include "libre-accounting.labels" . | nindent 4 }}
  annotations:
    # Hook-scoped: exists only for the install Job and is deleted once it
    # succeeds, so first-run credentials don't linger in the cluster. The
    # database password is duplicated here because the chart's main Secret
    # does not exist yet at pre-install time.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- if $adminPassword }}
  admin-password: {{ .Values.setup.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if $dbPassword }}
  db-password: {{ .Values.db.password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
