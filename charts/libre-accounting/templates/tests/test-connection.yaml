apiVersion: v1
kind: Pod
metadata:
  name: {{ include "libre-accounting.fullname" . }}-test-connection
  labels:
    {{- include "libre-accounting.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - wget
        - -qO-
        # The app trusts only the APP_URL host (TrustHosts middleware).
        - --header=Host:{{ include "libre-accounting.hostname" . }}
        - http://{{ include "libre-accounting.fullname" . }}:{{ .Values.service.port }}/health
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]
